# Nginx de produção do FinFlow.
#
# Responsabilidades:
# - Servir o bundle React (SPA) e rotear /api e /admin para o Gunicorn.
# - Servir /media/ (comprovantes) DIRETO DO DISCO (volume compartilhado com o
#   backend) — mas somente depois de validar a credencial no backend via
#   auth_request (JWT + isolamento por tenant em apps/faturamento/media_views.py).
#   Comprovantes NUNCA são públicos: sem token válido, o Nginx devolve 401.
# - Servir /static/ (coletado pelo collectstatic do Django).

server {
    listen 80;
    server_name _;

    client_max_body_size 6m;  # comprovantes: limite do backend é 5MB

    # ------------------------------------------------------------------
    # API e admin Django -> Gunicorn
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Comprovantes: arquivos servidos do disco APÓS validação no backend.
    #
    # Fluxo: Nginx faz uma subrequest interna para /media-auth/ passando a
    # URI original; a view MediaProtegidaView valida JWT (header Authorization
    # ou cookie de sessão do admin) e isolamento por tenant. Só com 200 o
    # arquivo é servido; qualquer outro código vira 401 para o cliente.
    # ------------------------------------------------------------------
    location /media/ {
        auth_request /media-auth/;
        error_page 401 = @media_nao_autorizado;

        alias /media/;
        # Path traversal extra no próprio Nginx (defesa em profundidade).
        try_files $uri =404;

        # Comprovantes nunca devem ser indexados ou cacheados em proxies.
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # Subrequest de autenticação (invisível para o cliente).
    location = /media-auth/ {
        internal;
        proxy_pass http://backend:8000/api/media/auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # A URI ORIGINAL é o que a view valida (arquivo + dono).
        proxy_set_header X-Original-URI $request_uri;
        # Credencial: o frontend envia o JWT no header da requisição original.
        proxy_set_header Authorization $http_authorization;
        # Alternativa: admins logados no Django admin (cookie de sessão).
        proxy_set_header Cookie $http_cookie;
    }

    location @media_nao_autorizado {
        return 401 "Comprovante protegido: autenticacao necessaria.\n";
    }

    # ------------------------------------------------------------------
    # Estáticos do Django (admin, drf-spectacular etc.)
    # ------------------------------------------------------------------
    location /static/ {
        alias /static/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # SPA React: bundle estático + fallback para o roteador.
    # ------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
