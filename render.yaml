services:
  # --- BACKEND (Django API + Celery Worker e Beat embutidos - Plano 100% FREE) ---
  - type: web
    name: finflow-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    region: oregon
    plan: free
    # Health check: 200 rápido, sem DB/auth (ver finflow/health.py).
    # Sem isto o Render só verifica a porta TCP — e um app em crash-loop
    # de migrate pode ficar "live" com banco desatualizado.
    healthCheckPath: /healthz/
    envVars:
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "false"
      # Confia em X-Forwarded-Proto (Render termina TLS na borda). Sem
      # isto, DEBUG=false ativa SECURE_SSL_REDIRECT e como o tráfego interno
      # chega em HTTP puro, o app vira um loop infinito de 301 — principal
      # causa do deploy nunca ficar "live".
      - key: TRUST_PROXY
        value: "1"
      - key: RUN_EMBEDDED_CELERY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: finflow-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://finflow-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        # Inclui a origem do PRÓPRIO backend: o login do Django admin é
        # feito no domínio da API e o CSRF check exige a origem explícita.
        value: https://finflow-frontend.onrender.com,https://finflow-backend.onrender.com
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_HOST
        fromDatabase:
          name: finflow-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: finflow-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: finflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finflow-db
          property: password
      - key: DB_PORT
        fromDatabase:
          name: finflow-db
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: finflow-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: finflow-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: finflow-redis
          property: connectionString
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: FinFlow <projetodefinancas34@gmail.com>
      - key: LEMBRETE_DIAS_ANTES
        value: "10,5,1,0"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # --- FRONTEND (React Static Site - 100% Grátis no Render) ---
  - type: web
    name: finflow-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://finflow-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- REDIS (Plano Gratuito) ---
  - type: redis
    name: finflow-redis
    plan: free
    ipAllowList: []

databases:
  # --- POSTGRESQL GERENCIADO (plano Free: expira 30 DIAS após a criação;
  # após mais 14 dias de graça, os dados são apagados — ver render.com/docs/free) ---
  - name: finflow-db
    databaseName: financeiro
    user: finflow_user
    plan: free