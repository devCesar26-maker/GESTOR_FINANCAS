services:
  # --- BACKEND (Django API + Celery Worker e Beat embutidos - Plano 100% FREE) ---
  - type: web
    name: finflow-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    region: oregon
    plan: free
    #healthCheckPath: /admin/login/
    envVars:
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "false"
      - key: RUN_EMBEDDED_CELERY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: finflow-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://finflow-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://finflow-frontend.onrender.com
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_HOST
        fromDatabase:
          name: finflow-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: finflow-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: finflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finflow-db
          property: password
      - key: DB_PORT
        fromDatabase:
          name: finflow-db
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: finflow-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: finflow-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: finflow-redis
          property: connectionString
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: FinFlow <projetodefinancas34@gmail.com>
      - key: LEMBRETE_DIAS_ANTES
        value: "10,5,1,0"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # --- FRONTEND (React Static Site - 100% Grátis no Render) ---
  - type: web
    name: finflow-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://finflow-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- REDIS (Plano Gratuito) ---
  - type: redis
    name: finflow-redis
    plan: free
    ipAllowList: []

databases:
  # --- POSTGRESQL GERENCIADO (Plano Gratuito por 90 dias no Render) ---
  - name: finflow-db
    databaseName: financeiro
    user: finflow_user
    plan: free