# ---------------------------------------------------------------------------
# FinFlow — Blueprint de deploy no Render (plano FREE)
#
# Arquitetura (2 serviços, tudo 100% no plano gratuito):
#   1) finflow-backend  (type: web, docker) — Django + Gunicorn, com Celery
#      Worker (-P solo) e Beat EMBUTIDOS no mesmo container (entrypoint.sh),
#      poupando um Background Worker pago. Banco e broker são EXTERNOS e
#      gratuitos: Supabase (Postgres, DATABASE_URL) e Upstash (Redis,
#      CELERY_BROKER_URL) — preenchidos à mão no painel (sync: false).
#   2) finflow-frontend (runtime: static) — SPA React/Vite publicada na CDN
#      do Render, com rewrite de todas as rotas para /index.html.
#
# Aplicar: Render Dashboard → New → Blueprint → apontar para este repo
# (o render.yaml precisa estar na RAIZ). Depois, em finflow-backend →
# Environment, preencha DATABASE_URL e CELERY_BROKER_URL (veja comentários).
# ---------------------------------------------------------------------------

services:
  # ===========================================================================
  # A) BACKEND — Django API + Celery embutido (Worker + Beat) em 1 Web Service
  # ===========================================================================
  - type: web
    name: finflow-backend
    # "env: docker" foi renomeado para "runtime: docker" no Blueprint Spec
    # atual (env segue aceito como alias legado, mas o validador atual pede
    # runtime).
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile.prod
    dockerContext: backend
    # NÃO use "/": o projeto não define rota raiz (daria 404 e o deploy
    # ficaria "Timed Out"). /healthz/ é o health check oficial do projeto:
    # leve (sem DB/auth), resiste a Host header arbitrário e é isento do
    # redirect HTTPS (ver finflow/health.py e SECURE_REDIRECT_EXEMPT).
    healthCheckPath: /healthz/

    envVars:
      # --- Essentials ------------------------------------------------------
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "false"
      # Sobe o Celery (worker -P solo + beat) no MESMO container, via
      # entrypoint.sh — plano free = 1 web service só.
      - key: RUN_EMBEDDED_CELERY
        value: "true"
      # Render gera e rotaciona a chave automaticamente no painel.
      # (Equivale ao "generateString: true" de specs antigas — hoje o campo
      # do Blueprint Spec é generateValue.)
      - key: SECRET_KEY
        generateValue: true

      # --- Infra externa GRATUITA (preencher manualmente no painel) --------
      # Supabase → Project Settings → Database → Connection string:
      #   use a URI do POOLER (porta 6543) p/ Free, ex.:
      #   postgresql://postgres.<ref>:<senha>@aws-0-<regiao>.pooler.supabase.com:6543/postgres
      #   (o settings.py detecta a porta 6543 e desabilita cursores
      #   server-side automaticamente; sslmode=require é o padrão).
      - key: DATABASE_URL
        sync: false
      # Upstash → Redis → Endpoint details: copie a conexão TLS, ex.:
      #   rediss://default:<senha>@<host>.upstash.io:6379
      #   (O settings.py reutiliza esta URL no cache de rate-limit quando
      #   REDIS_URL não está definida — Upstash Free só tem a DB 0.)
      - key: CELERY_BROKER_URL
        sync: false

      # --- Hosts / CORS / CSRF (deploy cross-origin: SPA + API) ------------
      # Aceita qualquer subdomínio *.onrender.com: o Render gera um sufixo
      # aleatório que MUDA se o serviço for recriado — lista fixa quebraria.
      # Troque/remova se usar domínio próprio.
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # Render termina o TLS na borda e repassa HTTP puro: sem isto,
      # SECURE_SSL_REDIRECT vira um loop infinito de 301 e o deploy nunca
      # fica "live".
      - key: TRUST_PROXY
        value: "1"
      # Regex cobre o subdomínio aleatório do frontend (e do próprio backend).
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: '^https://[a-z0-9-]+\.onrender\.com$'
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # SPA e API em subdomínios DIFERENTES = contexto cross-site: os cookies
      # (csrftoken e refresh_token) só viajam no XHR com SameSite=None.
      # Em dev (mesma origem via proxy Vite) o padrão Lax é mantido.
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: REFRESH_COOKIE_SAMESITE
        value: "None"

      # --- E-mail / mídia (opcionais, preencher no painel se usar) ---------
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: FinFlow <projetodefinancas34@gmail.com>
      # Recomendado no Render Free: disco é EFÊMERO a cada deploy — comprovantes
      # (/media/) só persistem com Cloudinary configurado.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ===========================================================================
  # B) FRONTEND — React (Vite) como Static Site (CDN global, grátis)
  # ===========================================================================
  # No Blueprint Spec atual, static site = type: web + runtime: static
  # (o tipo "static" puro não é aceito pelo validador; "env: static" é o
  # alias legado).
  - type: web
    name: finflow-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    # Vite → dist (Create React App seria frontend/build)
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        # Referência dinâmica ao backend no MESMO Blueprint: o Render resolve
        # o host real (com sufixo aleatório) na criação e mantém em sync nos
        # redeploys. O client.js normaliza o valor (adiciona https:// se
        # faltar — property: host devolve só o domínio, sem esquema).
        # IMPORTANTE: VITE_* é variável de BUILD (embutida no bundle) — se o
        # backend for recriado/renomeado, faça um "Clear cache & deploy" no
        # frontend para regenerar o bundle com a nova URL.
        fromService:
          type: web
          name: finflow-backend
          property: host
    # SPA: qualquer rota cai no index.html (React Router resolve client-side).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Assets do Vite têm hash no nome: cache agressivo e seguro.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
